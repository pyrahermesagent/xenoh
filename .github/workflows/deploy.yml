# XenoHeart — export the Godot web build and deploy it to Hetzner.
#
# Runs on the standard x86-64 GitHub runner. The Web export is architecture-
# independent (Emscripten -> single-threaded wasm), so the x86-64 Godot
# produces the identical artifact we build locally on the arm64 DGX Spark.
#
# Required repo secrets:
#   HETZNER_HOST  — e.g. 185.x.x.x (or ssh alias)
#   HETZNER_USER  — e.g. root
#   HETZNER_KEY   — the private SSH key (PEM) for that host
#
# The web build is served from $HETZNER_DEPLOY_DIR (default ~/xenoh/). Point
# your web server (nginx/caddy) at that directory.

name: deploy-web

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"
  GODOT_TAG: "4.7.1-stable"
  DEPLOY_DIR: "~/xenoh"

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt-get update -y && sudo apt-get install -y unzip rsync

      - name: Download Godot ${{ env.GODOT_VERSION }} (linux x86_64)
        run: |
          curl -sL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v${GODOT_TAG}_linux.x86_64
          ./Godot_v${GODOT_TAG}_linux.x86_64 --version

      - name: Install web export templates
        run: |
          # The .tpz extracts to "templates/*.zip"; Godot's export template
          # manager looks for them DIRECTLY inside a version dir, so install
          # the *contents* of templates/ into ~/.local/share/godot/export_templates/<ver>.stable/
          curl -sL -o templates.zip "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_export_templates.tpz"
          unzip -q -o templates.zip
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp templates/*.zip templates/*.dat ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          ls ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable | grep -c web_nothreads

      - name: Import project
        run: ./Godot_v${GODOT_TAG}_linux.x86_64 --headless --path . --import

      - name: Export web build (threads disabled)
        run: |
          ./Godot_v${GODOT_TAG}_linux.x86_64 --headless --path . --export-release "Web" export/web/index.html
          cp YTGameSDK.js export/web/
          find export/web -name "*.import" -delete
          ls -la export/web

      - name: Sanity-check export
        run: |
          test -f export/web/index.html
          test -f export/web/index.wasm
          test -f export/web/index.js
          test -f export/web/index.pck
          test -f export/web/YTGameSDK.js
          echo "export artifacts present"

      - name: Deploy to Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_KEY: ${{ secrets.HETZNER_KEY }}
        run: |
          test -n "$HETZNER_HOST" && test -n "$HETZNER_USER" && test -n "$HETZNER_KEY" \
            || { echo "::error::Missing HETZNER_HOST / HETZNER_USER / HETZNER_KEY secrets"; exit 1; }
          KEYFILE="$(mktemp)"
          printf '%s\n' "$HETZNER_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          ssh -o StrictHostKeyChecking=accept-new \
               -i "$KEYFILE" "${HETZNER_USER}@${HETZNER_HOST}" \
               "mkdir -p ${DEPLOY_DIR}"
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=accept-new -i $KEYFILE" \
               ./export/web/ "${HETZNER_USER}@${HETZNER_HOST}:${DEPLOY_DIR}/"
          rm -f "$KEYFILE"
          echo "deployed to ${HETZNER_USER}@${HETZNER_HOST}:${DEPLOY_DIR}"
